name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Validate mock JSON against shared schema
        run: uv run python scripts/validate_schema.py data/mock/results.mock.json
      - name: Run tests
        run: uv run pytest -v
