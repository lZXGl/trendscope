name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --frozen --extra api
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Validate mock JSON against shared schema
        run: uv run python scripts/validate_schema.py data/mock/results.mock.json
      - name: Run tests
        run: uv run pytest -v
      - name: Smoke-test production HTTP API using measured cached observations only
        run: >-
          uv run python -m scripts.smoke_job_api
          --state-dir "$RUNNER_TEMP/http-jobs"
