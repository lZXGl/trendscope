name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Validate mock JSON against shared schema
        run: uv run python scripts/validate_schema.py data/mock/results.mock.json
      - name: Run tests
        run: uv run pytest -v
      - name: Verify measured precomputed NDVI build without writing source datasets
        run: >-
          uv run python -m src.pipeline.build
          --input data/processed/nile_delta_ndvi.csv
          --out-dir "$RUNNER_TEMP/verified-ndvi"
          --jobs-dir "$RUNNER_TEMP/empty-jobs"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Typecheck and build web
        if: hashFiles('src/web/package.json') != ''
        working-directory: src/web
        run: npm ci && npx tsc --noEmit && npm run build && node ../../scripts/prepare-static-release.mjs dist/data
