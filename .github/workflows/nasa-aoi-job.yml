name: Run NASA AOI Job

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Bounding box as min_lon,min_lat,max_lon,max_lat (e.g. 30.7,30.7,31.2,31.2)"
        required: true
        type: string
      start_date:
        description: "Start date (MM-DD-YYYY)"
        required: false
        default: "01-01-2001"
        type: string
      end_date:
        description: "End date (MM-DD-YYYY)"
        required: false
        default: "12-31-2024"
        type: string
      job_id:
        description: "Optional existing job_id to resume (aoi_<16hex>)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: nasa-aoi-${{ inputs.bbox }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process-aoi:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Validate inputs and create or reuse job
        id: create_job
        shell: bash
        run: |
          set -euo pipefail
          BBOX_CLEAN=$(echo "${{ inputs.bbox }}" | tr ',' ' ')
          read -r MIN_LON MIN_LAT MAX_LON MAX_LAT <<< "$BBOX_CLEAN"

          JOB_JSON=$(uv run python -m src.pipeline.aoi_job --store-dir data/jobs create \
            --bbox "$MIN_LON" "$MIN_LAT" "$MAX_LON" "$MAX_LAT")

          JOB_ID=$(python3 -c 'import sys,json; print(json.loads(sys.stdin.read())["job_id"])' <<< "$JOB_JSON")
          STATUS=$(python3 -c 'import sys,json; print(json.loads(sys.stdin.read())["status"])' <<< "$JOB_JSON")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "initial_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Job $JOB_ID initial status: $STATUS"

      - name: Execute NASA AOI job (if not cached/completed)
        if: steps.create_job.outputs.initial_status != 'completed'
        shell: bash
        env:
          APPEEARS_TOKEN: ${{ secrets.APPEEARS_TOKEN }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${APPEEARS_TOKEN:-}" ] && { [ -z "${EARTHDATA_USER:-}" ] || [ -z "${EARTHDATA_PASS:-}" ]; }; then
            echo "Error: Configure APPEEARS_TOKEN or EARTHDATA_USER + EARTHDATA_PASS in repository secrets." >&2
            exit 1
          fi
          uv run python -m src.pipeline.aoi_job --store-dir data/jobs run \
            --job-id "${{ steps.create_job.outputs.job_id }}"

      - name: Persist job status and result JSON
        if: always() && steps.create_job.outputs.job_id != ''
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID="${{ steps.create_job.outputs.job_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "data/jobs/jobs/${JOB_ID}.json" || true
          if [ -f "data/jobs/results/${JOB_ID}.json" ]; then
            git add -f "data/jobs/results/${JOB_ID}.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(jobs): persist AOI job ${JOB_ID} status/result"
            git push
          else
            echo "No job changes to persist."
          fi
