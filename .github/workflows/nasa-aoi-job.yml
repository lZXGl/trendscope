name: Run NASA AOI Job

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "min_lon,min_lat,max_lon,max_lat"
        required: true
        type: string
      start_date:
        description: "Start date (MM-DD-YYYY)"
        default: "01-01-2001"
        type: string
      end_date:
        description: "End date (MM-DD-YYYY)"
        default: "12-31-2024"
        type: string
      job_id:
        description: "Optional resume ID; must match bbox and dates"
        default: ""
        type: string

permissions:
  contents: write

# One writer per branch, including normalized duplicates and different date windows.
# This is a manual worker, not a durable public job queue (see docs/infrastructure.md).
concurrency:
  group: nasa-aoi-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-aoi:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen

      - name: Validate inputs and create or reuse job
        id: create_job
        env:
          BBOX_INPUT: ${{ inputs.bbox }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          REQUESTED_JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          read -r MIN_LON MIN_LAT MAX_LON MAX_LAT <<< "${BBOX_INPUT//,/ }"
          CREATE_CODE=0
          JOB_JSON=$(uv run python -m src.pipeline.aoi_job --store-dir data/jobs create \
            --bbox "$MIN_LON" "$MIN_LAT" "$MAX_LON" "$MAX_LAT" \
            --start-date "$START_DATE" --end-date "$END_DATE" --job-id "$REQUESTED_JOB_ID") || CREATE_CODE=$?
          JOB_ID=$(python3 -c 'import sys,json; print(json.load(sys.stdin)["job_id"])' <<< "$JOB_JSON")
          STATUS=$(python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])' <<< "$JOB_JSON")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "initial_status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$CREATE_CODE"

      - name: Prepare NASA task checkpoint (no downloads)
        if: steps.create_job.outputs.initial_status != 'completed' && steps.create_job.outputs.initial_status != 'failed'
        env:
          APPEEARS_TOKEN: ${{ secrets.APPEEARS_TOKEN }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
          JOB_ID: ${{ steps.create_job.outputs.job_id }}
        run: uv run python -m src.pipeline.aoi_job --store-dir data/jobs prepare --job-id "$JOB_ID"

      - name: Preserve checkpoint artifact
        if: always() && steps.create_job.outputs.job_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: nasa-checkpoint-${{ steps.create_job.outputs.job_id }}-${{ github.run_attempt }}
          path: data/jobs/jobs/${{ steps.create_job.outputs.job_id }}.json
          retention-days: 30

      - name: Persist checkpoint before waiting on NASA
        if: always() && steps.create_job.outputs.job_id != ''
        env:
          JOB_ID: ${{ steps.create_job.outputs.job_id }}
        run: uv run python -m scripts.persist_job --job-id "$JOB_ID" --branch "$GITHUB_REF_NAME"

      - name: Execute prepared job
        if: success() && steps.create_job.outputs.initial_status != 'completed' && steps.create_job.outputs.initial_status != 'failed'
        env:
          APPEEARS_TOKEN: ${{ secrets.APPEEARS_TOKEN }}
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
          JOB_ID: ${{ steps.create_job.outputs.job_id }}
        run: uv run python -m src.pipeline.aoi_job --store-dir data/jobs run --job-id "$JOB_ID" --work-dir "$RUNNER_TEMP/trendscope-aoi"

      - name: Preserve processing evidence before publishing status
        if: always() && steps.create_job.outputs.job_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: nasa-evidence-${{ steps.create_job.outputs.job_id }}-${{ github.run_attempt }}
          path: |
            data/jobs/jobs/${{ steps.create_job.outputs.job_id }}.json
            data/jobs/results/${{ steps.create_job.outputs.job_id }}.json
            ${{ runner.temp }}/trendscope-aoi/processed/
          retention-days: 30

      - name: Persist final status and result
        if: always() && steps.create_job.outputs.job_id != ''
        env:
          JOB_ID: ${{ steps.create_job.outputs.job_id }}
        run: uv run python -m scripts.persist_job --job-id "$JOB_ID" --branch "$GITHUB_REF_NAME"
