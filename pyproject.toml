[project]
name = "trendscope"
version = "0.1.0"
description = "NASA Space Apps Challenge — Earth System Trend Detective"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "global-land-mask>=1.0.0",
    "jsonschema>=4.23.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "rasterio>=1.4.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
